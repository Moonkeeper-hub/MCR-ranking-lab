<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: auto;
    min-height: 0;
    overflow: hidden;
    background: transparent;
    color: inherit;
    font-family: "Cambria Math", "STIX Two Math", "Times New Roman", serif;
  }
  .box {
    padding: 6px 0 8px 0;
  }
  .caption {
    font-family: sans-serif;
    font-size: 12px;
    opacity: .62;
    margin: 8px 0 1px 0;
  }
  .formula {
    font-size: 25px;
    line-height: 1.58;
    white-space: normal;
    overflow-wrap: anywhere;
  }
  .var {
    cursor: pointer;
    border-bottom: 1px dotted rgba(120,120,120,.75);
    border-radius: 2px;
    padding: 0 2px;
    transition: background .12s ease, border-color .12s ease;
  }
  .var:hover {
    background: rgba(120,120,120,.11);
    border-bottom-style: solid;
  }
  .var.selected {
    background: rgba(120,120,120,.16);
    border-bottom-style: solid;
  }
  sub { font-size: .72em; vertical-align: -0.25em; }
  .note {
    font-family: sans-serif;
    font-size: 12px;
    opacity: .62;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
const Streamlit = {
  setComponentReady: function() {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:componentReady",
      apiVersion: 1
    }, "*");
  },
  setComponentValue: function(value) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setComponentValue",
      value: value
    }, "*");
  },
  setFrameHeight: function(height) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setFrameHeight",
      height: Math.max(80, Math.ceil(height || 80))
    }, "*");
  }
};

function reportHeight() {
  const root = document.getElementById("root");
  if (!root) return;
  // Measure only the rendered component contents.
  // Using documentElement.scrollHeight here creates a feedback loop:
  // iframe gets taller -> document gets taller -> iframe gets taller again.
  const rect = root.getBoundingClientRect();
  Streamlit.setFrameHeight(rect.height + 8);
}

let currentArgs = {};
let selected = null;

function token(label, key, extraClass="") {
  return `<span class="var ${selected === key ? "selected" : ""} ${extraClass}" data-key="${key}">${label}</span>`;
}

function legacyHtml() {
  return `
    <div class="box">
      <div class="caption">Основная формула расчёта рейтинга</div>
      <div class="formula">
        ${token("Рейтинг","Rating")} =
        0,25 · ${token("ЭУ","EU")} +
        0,75 · ${token("T5","T5")}
      </div>

      <div class="caption">Турнирный показатель и T5</div>
      <div class="formula">
        ${token("НРКТВТ","X")} =
        ${token("НР","NR")} · ${token("КТ","KT")} · ${token("ВТ","VT")}
        &nbsp;&nbsp;&nbsp;
        ${token("T5","T5")} =
        (Σ пяти лучших ${token("НРКТВТ","X")}) / 5
      </div>

      <div class="caption">Норморейтинг</div>
      <div class="formula">
        ${token("НР","NR")} =
        1000 · (${token("ЧУТ","N")} − ${token("Место","place")}) /
        (${token("ЧУТ","N")} − 1)
      </div>

      <div class="caption">Коэффициент турнира</div>
      <div class="formula">
        ${token("КТ","KT")} =
        ${token("КТ","KT_S")}<sub>ЧС</sub> +
        ${token("КТ","KT_N")}<sub>ЧУТ</sub> +
        ${token("КТ","KT_EU")}<sub>ЭУ</sub> +
        ${token("КТ","KT_W")}<sub>W</sub>
      </div>

      <div class="caption">Выполнение нормы ЭУ</div>
      <div class="formula">
        ${token("НР","NR")} · ${token("КТ","KT")} ≥ ${token("ЭУ","EU")}
        &nbsp;&nbsp;→&nbsp;&nbsp;
        ${token("успехи / неуспехи","marks")}
        &nbsp;&nbsp;·&nbsp;&nbsp;
        ${token("Double Strike","DoubleStrike")}
      </div>
      <div class="note">
        Нажмите на обозначение, чтобы открыть пояснение и связанный параметр.
      </div>
    </div>
  `;
}

function trueSkillHtml() {
  return `
    <div class="box">
      <div class="caption">Публикуемая консервативная оценка</div>
      <div class="formula">
        ${token("score","TS_score")} =
        ${token("μ","mu")} − ${token("k","k")} · ${token("σ","sigma")}
      </div>
      <div class="caption">Последовательное обновление после турнира</div>
      <div class="formula">
        ${token("Bayes update","BayesUpdate")}
        (${token("μ","mu")}, ${token("σ","sigma")}, ${token("rank","rank")})
      </div>
    </div>
  `;
}

function render() {
  selected = currentArgs.selected || null;
  const root = document.getElementById("root");
  root.innerHTML = currentArgs.formula_id === "trueskill" ? trueSkillHtml() : legacyHtml();

  document.querySelectorAll(".var").forEach(el => {
    el.addEventListener("click", () => {
      const key = el.dataset.key;
      selected = key;
      currentArgs.selected = key;
      render();
      Streamlit.setComponentValue(key);
    });
  });

  requestAnimationFrame(reportHeight);
}

window.addEventListener("message", event => {
  if (!event.data || event.data.type !== "streamlit:render") return;
  currentArgs = event.data.args || {};
  render();
});

Streamlit.setComponentReady();
Streamlit.setFrameHeight(250);

// Re-measure only when the actual formula content changes size.
const resizeObserver = new ResizeObserver(() => reportHeight());
const observedRoot = document.getElementById("root");
if (observedRoot) resizeObserver.observe(observedRoot);
</script>
</body>
</html>
